[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siren"
version = "0.1.0"
description = "Satellite-Informed Risk & Emergency Network — early warning and disaster-response decision platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "xarray>=2024.1",
    "pysheds>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# Production extras (ADR-011, accepted 2026-09-08). Install with:
#   pip install -e ".[production]"          # production stack only
#   pip install -e ".[dev,ml,production]"   # everything
# These are NOT required for the offline demo (SQLite path). They activate
# when DATABASE_URL=postgresql://... is set at runtime.
production = [
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.14",
    "celery>=5.3",
    "redis>=5.0",
    "shapely>=2.0",   # already in core, listed here for clarity
    "xgboost>=2.0",
    "shap>=0.44",
]

[tool.setuptools.packages.find]
include = ["siren*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
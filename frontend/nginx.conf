server {
    listen 5175;

    # Use Docker's internal DNS resolver (127.0.0.11)
    # Variables + resolver make nginx resolve at request time, not startup
    resolver 127.0.0.11 valid=10s;

    # Proxy API requests to the backend container
    # /api/basin -> http://backend:8010/basin (strips /api prefix)
    location /api/ {
        set $backend http://backend:8010;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy processed raster/PNG file access to the backend static mount
    # /data/processed/foo.png -> http://backend:8010/data/processed/foo.png
    location /data/ {
        set $backend http://backend:8010;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Serve the SPA — fall back to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
